# OPT-IN ONLY. Add as a package after choosing the model and defining
# substitutions.wake_word_model in esp32-rlcd42.yaml, e.g. an official
# model ID. No wake word has been chosen as the project default.
esp32:
  framework:
    components:
      - espressif/esp-nn==1.1.2

micro_wake_word:
  id: local_wake
  microphone:
    microphone: onboard_mic
    channels: 0
    gain_factor: 4
  models:
    - model: ${wake_word_model}
  on_wake_word_detected:
    - text_sensor.template.publish:
        id: voice_state
        state: "Wake Detected"
    - component.update: rlcd_screen
    - voice_assistant.start:
        wake_word: !lambda "return wake_word;"

voice_assistant:
  micro_wake_word: local_wake
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:
  on_end:
    - delay: 300ms
    - micro_wake_word.start:
  on_error:
    - delay: 300ms
    - micro_wake_word.start:
