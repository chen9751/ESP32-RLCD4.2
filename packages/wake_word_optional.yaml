# Local wake-word model. Selected model is defined by the main YAML.
# On-device recognition uses the ES7210, without sending standby audio to HA.
# Voice Assistant controls start/stop lifecycle in packages/voice_ptt.yaml.
esp32:
  framework:
    components:
      - espressif/esp-nn==1.1.2

micro_wake_word:
  id: local_wake
  microphone:
    microphone: onboard_mic
    channels: 0
    gain_factor: 4
  models:
    - model: ${wake_word_model}
  on_wake_word_detected:
    - text_sensor.template.publish:
        id: voice_state
        state: "Wake Detected"
    - component.update: rlcd_screen
    - voice_assistant.start:
        wake_word: !lambda "return wake_word;"
