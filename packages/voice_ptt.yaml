# ES7210 digitizes the onboard microphones. Channel 0 is sent to HA.
# Hey Jarvis runs on-device and KEY remains a manual fallback.
i2s_audio:
  - id: board_i2s
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO16

audio_adc:
  - platform: es7210
    id: onboard_adc
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 24dB

microphone:
  - platform: i2s_audio
    id: onboard_mic
    i2s_audio_id: board_i2s
    i2s_din_pin: GPIO10
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    pdm: false

text_sensor:
  - platform: template
    id: voice_state
    name: "Assist Status"
    entity_category: diagnostic

  - platform: template
    id: last_command
    name: "Last Recognized Speech"

  - platform: template
    id: last_reply
    name: "Last Assist Reply"

voice_assistant:
  id: assist
  microphone:
    microphone: onboard_mic
    channels: 0
    gain_factor: 4
  micro_wake_word: local_wake
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS

  on_client_connected:
    - text_sensor.template.publish:
        id: voice_state
        state: "Ready: Hey Jarvis"
    - micro_wake_word.start:
    - component.update: rlcd_screen

  on_client_disconnected:
    - micro_wake_word.stop:
    - text_sensor.template.publish:
        id: voice_state
        state: "HA Offline"
    - component.update: rlcd_screen

  on_listening:
    - micro_wake_word.stop:
    - text_sensor.template.publish:
        id: voice_state
        state: "Listening"
    - component.update: rlcd_screen

  on_stt_end:
    - text_sensor.template.publish:
        id: last_command
        state: !lambda "return x;"
    - text_sensor.template.publish:
        id: voice_state
        state: "Processing"
    - component.update: rlcd_screen

  on_intent_end:
    - text_sensor.template.publish:
        id: voice_state
        state: "Processed"
    - component.update: rlcd_screen

  # In HA, this text event requires a TTS stage; there is no speaker output by default.
  on_tts_start:
    - text_sensor.template.publish:
        id: last_reply
        state: !lambda "return x;"
    - component.update: rlcd_screen

  on_error:
    - text_sensor.template.publish:
        id: voice_state
        state: "Assist Error"
    - component.update: rlcd_screen
    - if:
        condition:
          voice_assistant.connected:
        then:
          - micro_wake_word.start:

  on_end:
    - text_sensor.template.publish:
        id: voice_state
        state: "Ready: Hey Jarvis"
    - component.update: rlcd_screen
    - if:
        condition:
          voice_assistant.connected:
        then:
          - micro_wake_word.start:
