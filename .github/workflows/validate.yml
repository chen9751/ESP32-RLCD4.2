name: Validate ESPHome configuration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ESPHome
        run: python -m pip install esphome==2026.10.2
      - name: Create CI-only dummy API key
        run: |
          cat > secrets.yaml <<'EOF'
          api_encryption_key: "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="
          EOF
      - name: Validate USB provisioning and Hey Jarvis configuration
        run: esphome config esp32-rlcd42.yaml
      - name: Compile ESP32-S3 firmware (no flashing)
        run: esphome compile esp32-rlcd42.yaml
