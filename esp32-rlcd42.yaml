# Default firmware: local display/sensors and KEY-triggered HA Assist.
# Wake word and speaker are intentionally NOT enabled here.
substitutions:
  device_name: esp32-rlcd42
  friendly_name: RLCD Assist 4.2

packages:
  core: !include packages/core.yaml
  buses: !include packages/buses.yaml
  sensors: !include packages/sensors.yaml
  display: !include packages/display.yaml
  voice: !include packages/voice_ptt.yaml
  buttons: !include packages/buttons.yaml

  # Optional, enable only after checking memory and the chosen voice pipeline:
  # speaker: !include packages/speaker_optional.yaml
  # Wake word: choose a verified model first and add wake_word_model substitution.
  # wake: !include packages/wake_word_optional.yaml
